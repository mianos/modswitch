dependencies:
  # Modbus RTU slave on the RS485 port. Same component and version as the
  # mqttcan master at the other end of the pair.
  espressif/esp-modbus: "^2.1"

  # Shared infrastructure — mianesp repo, the same set mqttcan uses, so Wi-Fi
  # provisioning, the HTTP surface and the settings store behave identically
  # across both halves of this system. No mqttwrapper: this node is an
  # actuator, not a reporter, and everything it has to say fits in GET /status.
  jsonwrapper:
    git: git@github.com:mianos/mianesp.git
    path: components/jsonwrapper
    version: main
  nvsstoragemanager:
    git: git@github.com:mianos/mianesp.git
    path: components/nvsstoragemanager
    version: main
  wifimanager:
    git: git@github.com:mianos/mianesp.git
    path: components/wifimanager
    version: main
  webserver:
    git: git@github.com:mianos/mianesp.git
    path: components/webserver
    version: main
  settingsbase:
    git: git@github.com:mianos/mianesp.git
    path: components/settingsbase
    version: main
  espressif/cjson: "*"
